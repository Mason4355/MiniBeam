<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniBeam</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div>
            <div class="brand-name">MiniBeam</div>
            <div id="roomLabel" class="room-label">Комната</div>
          </div>
        </div>
        <div class="invite">
          <span id="inviteUrl">Запуск сервера...</span>
          <button id="copyInviteButton" type="button">Копировать приглашение</button>
        </div>
      </header>

      <main class="layout">
        <aside class="participants-rail">
          <div id="participants" class="participants"></div>
        </aside>

        <section class="room">
          <div class="browser-chrome">
            <div class="tabs">
              <button id="tabTitle" class="tab active" type="button">New tab</button>
              <button id="newTabButton" class="tab-plus" type="button">+</button>
            </div>

            <form id="addressForm" class="addressbar">
              <button id="backButton" class="circle-button" type="button" aria-label="Назад">‹</button>
              <button id="forwardButton" class="circle-button" type="button" aria-label="Вперёд">›</button>
              <button id="reloadButton" class="circle-button" type="button" aria-label="Обновить">↻</button>
              <input id="addressInput" type="text" autocomplete="off" placeholder="Введите адрес или поисковый запрос" />
              <span id="statusText" class="toolbar-status">Готово</span>
              <span id="adblockText" class="shield">Блок: 0</span>
              <button class="go-button" type="submit">Go</button>
            </form>

            <div class="viewport">
              <div id="homeScreen" class="home-screen">
                <div class="home-logo">
                  <span class="home-mark">M</span>
                  <strong>MINIBEAM</strong>
                </div>
                <form id="homeForm" class="home-search">
                  <input id="homeInput" type="text" autocomplete="off" placeholder="Search DuckDuckGo or type a URL" />
                </form>
                <div class="shortcuts">
                  <button type="button" data-url="https://www.youtube.com">YouTube</button>
                  <button type="button" data-url="https://hd.kinopoisk.ru">Кинопоиск</button>
                  <button type="button" data-url="https://soundcloud.com">SoundCloud</button>
                  <button type="button" data-url="https://duckduckgo.com">DuckDuckGo</button>
                  <button type="button" data-url="https://neal.fun/infinite-craft/">Infinite Craft</button>
                </div>
              </div>
              <div id="pageOverlay" class="page-overlay" hidden></div>
            </div>
          </div>
        </section>

        <aside class="chat-panel">
          <header>Чат</header>
          <div id="messages" class="messages"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" maxlength="600" placeholder="Сообщение" />
            <button type="submit">Отправить</button>
          </form>
        </aside>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
