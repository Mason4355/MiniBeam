<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniBeam</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="nav-rail" aria-label="Навигация">
        <div class="nav-top">
          <button class="nav-logo" type="button" title="MiniBeam">M</button>
          <button class="nav-icon" type="button" title="Участники">👥</button>
          <button class="nav-avatar active" type="button" title="Дом">M</button>
        </div>
        <div class="nav-bottom">
          <button class="nav-icon" type="button" title="Избранное">★</button>
          <button class="nav-icon" type="button" title="Загрузки">↓</button>
          <button class="nav-icon" type="button" title="Помощь">?</button>
          <button class="nav-avatar small" type="button" title="Профиль">В</button>
        </div>
      </aside>

      <main class="stage">
        <section class="browser-chrome">
          <div class="tabs">
            <button id="tabTitle" class="tab active" type="button"><span class="tab-favicon">◉</span> New tab</button>
            <button id="newTabButton" class="tab-plus" type="button">+</button>
          </div>

          <form id="addressForm" class="addressbar">
            <button id="backButton" class="circle-button" type="button" aria-label="Назад">‹</button>
            <button id="forwardButton" class="circle-button" type="button" aria-label="Вперёд">›</button>
            <button id="reloadButton" class="circle-button" type="button" aria-label="Обновить">↻</button>
            <input id="addressInput" type="text" autocomplete="off" placeholder="Search DuckDuckGo or type a URL" />
            <span class="extension-icon" title="MiniBeam">M</span>
            <span id="adblockText" class="extension-icon shield" title="Блокировщик рекламы">🛡</span>
            <span class="extension-icon" title="Расширения">▣</span>
            <button class="menu-button" type="button" aria-label="Меню">⋮</button>
          </form>

          <div class="viewport">
            <img id="browserStream" class="browser-stream" alt="Shared browser stream" draggable="false" />
            <div id="playerLayer" class="player-layer" hidden>
              <iframe id="youtubeFrame" class="youtube-frame" title="YouTube player" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" hidden></iframe>
              <video id="htmlVideo" class="html-video" playsinline hidden></video>
              <div id="iframeNotice" class="iframe-notice" hidden>
                <strong>Встроенный просмотр</strong>
                <span>Для этого сайта доступна синхронизация URL, чат и состояние комнаты.</span>
              </div>
            </div>
            <div id="homeScreen" class="home-screen">
              <div class="start-card">
                <div class="start-row">
                  <strong>Начать просмотр</strong>
                  <span>Область: по умолчанию</span>
                </div>
                <button id="startBrowserButton" class="start-browser" type="button">
                  <span>⏻</span>
                  Открыть новый браузер
                </button>
                <form id="homeForm" class="home-search">
                  <input id="homeInput" type="text" autocomplete="off" placeholder="Введите адрес или поисковый запрос" />
                </form>
                <div class="saved-title">Быстрый запуск</div>
                <div class="saved-list">
                  <button type="button" data-url="https://www.youtube.com">YouTube</button>
                  <button type="button" data-url="https://duckduckgo.com">DuckDuckGo</button>
                  <button type="button" data-url="https://soundcloud.com">SoundCloud</button>
                </div>
              </div>
            </div>
            <div id="pageOverlay" class="page-overlay" hidden></div>
          </div>
        </section>

        <footer class="stage-controls">
          <div class="left-controls">
            <button id="reportButton" class="report-button" type="button">Сообщить о проблеме</button>
            <span id="statusText" class="toolbar-status">Готово</span>
          </div>
          <div id="participants" class="participants"></div>
          <div class="right-controls">
            <button id="playPauseButton" class="tool-button" type="button" title="Play/Pause">▶</button>
            <input id="seekRange" class="seek-range" type="range" min="0" max="1000" value="0" aria-label="Позиция" />
            <button class="tool-button" type="button" title="Звук">🔊</button>
            <input id="volumeRange" class="volume" type="range" min="0" max="100" value="70" aria-label="Громкость" />
            <button class="tool-button" type="button" title="Во весь экран">⛶</button>
          </div>
        </footer>
      </main>

      <aside class="chat-panel">
        <header class="room-head">
          <span class="room-avatar">M</span>
          <div>
            <div id="roomLabel" class="room-label">Дом</div>
            <div class="online-dot">1 онлайн</div>
          </div>
          <button id="copyInviteButton" class="invite-icon" type="button" title="Пригласить">＋</button>
        </header>

        <nav class="chat-tabs">
          <button class="active" type="button">▰</button>
          <button type="button">☎</button>
          <button type="button">≡</button>
        </nav>

        <section class="invite-empty">
          <h2>Пригласите своих друзей</h2>
          <p>Пригласите других, чтобы вы могли смотреть и общаться вместе.</p>
          <button id="copyInviteButtonPanel" type="button">Пригласить друзей</button>
          <span id="inviteUrl">Запуск сервера...</span>
        </section>

        <div id="messages" class="messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" maxlength="600" placeholder="Type a message" />
          <button type="submit">GIF</button>
        </form>
      </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
