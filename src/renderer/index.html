<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniBeam</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MiniBeam</p>
          <h1 id="roomTitle">Комната</h1>
        </div>
        <div class="invite">
          <span id="serverUrl">Запуск сервера...</span>
          <button id="copyRoomButton" type="button">Скопировать код</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel participants-panel">
          <div class="panel-header">
            <h2>Участники</h2>
            <span id="participantCount">0</span>
          </div>
          <div id="participants" class="participants"></div>
        </aside>

        <section class="stage">
          <form id="videoForm" class="video-form">
            <input id="videoUrlInput" type="url" placeholder="Вставьте ссылку на видео или YouTube" />
            <button type="submit">Загрузить</button>
          </form>

          <div class="player-frame">
            <div id="youtubeHost" hidden></div>
            <video id="videoPlayer" playsinline></video>
            <div id="emptyState" class="empty-state">
              <strong>Ожидаем видео</strong>
              <span>Вставьте ссылку, чтобы начать совместный просмотр.</span>
            </div>
          </div>

          <div class="controls">
            <button id="playPauseButton" type="button">Play</button>
            <input id="seekControl" type="range" min="0" max="100" value="0" step="0.1" />
            <span id="timeLabel">00:00 / 00:00</span>
            <input id="volumeControl" type="range" min="0" max="1" value="0.85" step="0.01" aria-label="Volume" />
          </div>
        </section>

        <aside class="panel chat-panel">
          <div class="panel-header">
            <h2>Чат</h2>
          </div>
          <div id="messages" class="messages"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" maxlength="600" placeholder="Сообщение" />
            <button type="submit">Отправить</button>
          </form>
        </aside>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
